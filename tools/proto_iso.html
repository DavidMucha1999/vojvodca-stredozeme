<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Vojvodca Stredozeme – prototyp izometrickej bitky</title>
<style>
  html, body { margin: 0; background: #0b0806; color: #ecdfc6; font-family: Georgia, serif; }
  #wrap { position: relative; width: 1280px; margin: 10px auto; }
  canvas { display: block; width: 1280px; height: 800px; background: #1a2414; image-rendering: auto; }
  #info { position: absolute; left: 12px; top: 10px; background: rgba(18,14,12,.8); padding: 8px 12px; border: 1px solid #d9a441; font-size: 14px; line-height: 1.5; }
  b { color: #d9a441; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="2560" height="1600"></canvas>
<div id="info"><b>Prototyp 2,5D (izometrickej) bitky</b><br>Terén s výškou a tieňmi, rieka s brodom, hradba, vojaci v 8 smeroch, zástavy, prach.<br>Myš: posun kamery • koliesko: priblíženie • medzerník: pauza</div>
</div>
<script>
/*
 * Prototyp: všetko kreslené kódom na plátno v 2× rozlíšení. Svet je mriežka 40 × 40 políčok (dlaždica 64 × 32 px),
 * každé políčko má výšku; vojaci sú 2,5D postavičky so smerom (8 smerov), kreslia sa zoradené podľa hĺbky.

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = 2, TW = 64, TH = 32, N = 40;
let zoom = 1.15, camX = 40, camY = -330, paused = false, t = 0;
// výškové pole: kopec vpravo, údolie s riekou v strede
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };

  const hill = Math.max(0, 1 - Math.hypot(i - 30, j - 14) / 9) * 3.2, base = noise(i / 6, j / 6) * .9 + noise(i / 2.5, j / 2.5) * .3;

const iso = (x, y, h = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - h * 22];

const trees = []; for (let k = 0; k < 160; k++) { const x = Math.random() * N, y = Math.random() * N; const kd = KIND[Math.floor(y)][Math.floor(x)]; if (kd === 'grass' && noise(x / 4, y / 4) > .55 && !(y > 24 && y < 32 && x > 4 && x < 15) && !(x > 20 && x < 30 && y > 10 && y < 20)) trees.push({ x, y, s: .8 + Math.random() * .6, v: Math.floor(Math.random() * 3) }); }

// vojaci
const units = [];
const mkU = (x, y, side, kind) => units.push({ x, y, side, kind, dir: side ? 4 : 0, ph: Math.random() * 6, hp: 1, atk: 0, sp: kind === 'cav' ? .035 : .018, bn: Math.random() < .12 });

  ctx.strokeStyle = 'rgba(200,180,120,.35)'; ctx.lineWidth = 2;

}
function drawTree(o) {

  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x + 8 * s, y + 3, 22 * s, 9 * s, 0, 0, 7); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,220,.12)'; ctx.beginPath(); ctx.moveTo(x, y - 70 * s); ctx.lineTo(x - 14 * s, y - 40 * s); ctx.lineTo(x - 4 * s, y - 42 * s); ctx.fill();

function drawWall(w) {

  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 20, y + 10, 50, 20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#9a968c'; ctx.beginPath(); ctx.moveTo(x - W2, y - TH / 2 * (W2 / 32)); ctx.lineTo(x, y); ctx.lineTo(x, y - H2); ctx.lineTo(x - W2, y - H2 - TH / 2 * (W2 / 32)); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#b4b0a6'; ctx.beginPath(); ctx.moveTo(x, y - H2); ctx.lineTo(x + W2, y - H2 - TH / 2 * (W2 / 32)); ctx.lineTo(x, y - H2 - TH * (W2 / 32)); ctx.lineTo(x - W2, y - H2 - TH / 2 * (W2 / 32)); ctx.closePath(); ctx.fill();

/* 2,5D postavička: smer dir 0–7 (0 = doprava dole, proti smeru hodín), fáza chôdze ph, útok atk */

function render() {

  // svetlo: teplý gradient a vinetácia
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, 'rgba(255,200,120,.10)'); g.addColorStop(1, 'rgba(20,30,60,.18)'); ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
  const r = ctx.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * .4, cv.width / 2, cv.height / 2, cv.width * .7); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = r; ctx.fillRect(0, 0, cv.width, cv.height);
}
function loop() { if (!paused) step(); render(); requestAnimationFrame(loop); }
loop();
let drag = null;
cv.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, cx: camX, cy: camY }; });
window.addEventListener('mousemove', e => { if (drag) { camX = drag.cx + (e.clientX - drag.x); camY = drag.cy + (e.clientY - drag.y); } });
window.addEventListener('mouseup', () => drag = null);
cv.addEventListener('wheel', e => { zoom = Math.max(.5, Math.min(2.5, zoom * (e.deltaY > 0 ? .9 : 1.1))); e.preventDefault(); });
window.addEventListener('keydown', e => { if (e.key === ' ') paused = !paused; });
